<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | TOREX</title><link rel="stylesheet" href="design-system.css"><link rel="stylesheet" href="admin-panel.css"></head><body><div id="adminRoot"><section class="admin-login" id="adminLogin"><h1>ورود مدیر</h1><p class="muted">برای دسترسی به داشبورد، با حساب مدیر وارد شوید.</p><form id="adminLoginForm"><label>شماره موبایل<input id="adminPhone" required value="09120000000"></label><label>رمز عبور<input id="adminPassword" type="password" required></label><button class="button main-button" type="submit">ورود به داشبورد</button><p id="adminLoginError" class="error-state" hidden></p></form></section><div class="admin-shell admin-hidden" id="adminApp"><aside class="admin-sidebar"><div class="admin-brand">مدیریت TOREX</div><nav><a href="#dashboard" class="active">داشبورد</a><a href="#news">اخبار</a><a href="index.html">بازگشت به سایت</a></nav></aside><main class="admin-main"><header class="admin-toolbar"><div><h1>داشبورد</h1><p>مدیریت محتوای متصل به همان API و data store عمومی</p></div><button id="logoutButton" class="button second-button" type="button">خروج</button></header><section class="admin-grid" id="statsGrid"></section><section class="admin-section" id="news"><div class="admin-section__head"><h2>مدیریت اخبار</h2><button class="button main-button" id="createNewsButton" type="button">+ خبر جدید</button></div><div id="newsState" class="muted">در حال دریافت خبرها...</div><div style="overflow:auto"><table class="admin-table"><thead><tr><th>عنوان</th><th>دسته</th><th>وضعیت</th><th>تاریخ</th><th>عملیات</th></tr></thead><tbody id="newsTable"></tbody></table></div></section></main></div></div><dialog class="admin-modal" id="newsDialog"><form class="admin-form" id="newsForm" method="dialog"><h2 id="dialogTitle">خبر جدید</h2><input type="hidden" id="newsId"><label>عنوان<input id="newsTitle" required maxlength="140"></label><div class="admin-form__row"><label>دسته<input id="newsCategory" value="gaming" required></label><label>وضعیت<select id="newsStatus"><option value="published">منتشرشده</option><option value="draft">پیش‌نویس</option></select></label></div><label>خلاصه<input id="newsExcerpt" maxlength="240"></label><label>متن خبر<textarea id="newsText" required maxlength="5000"></textarea></label><label>تگ‌ها<input id="newsTags" placeholder="gaming, pc"></label><div class="admin-form__actions"><button type="button" id="cancelNewsButton">انصراف</button><button type="submit">ذخیره خبر</button></div></form></dialog><script src="app.js"></script><script src="admin-panel.js"></script></body></html>
