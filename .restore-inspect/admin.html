<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | VEXORA CHAT</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./design-system.css">
    <style>
        .admin-page {
            max-width: 760px;
            margin: 0 auto;
            padding: 40px 20px 120px;
        }

        .admin-page h1 {
            margin-bottom: 8px;
        }

        .admin-page .hint {
            color: #8a8fa3;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .admin-login {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        .admin-login input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #2a2f45;
            background: #14172a;
            color: #fff;
        }

        .admin-login button {
            padding: 12px 22px;
            border-radius: 12px;
            border: 0;
            background: #6c5ce7;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .pending-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #14172a;
            border: 1px solid #2a2f45;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .pending-card .p-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #6c5ce7;
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 18px;
        }

        .pending-card .p-info {
            flex: 1;
        }

        .pending-card .p-info strong {
            display: block;
            color: #fff;
        }

        .pending-card .p-info small {
            color: #8a8fa3;
        }

        .pending-card button {
            padding: 8px 16px;
            border-radius: 10px;
            border: 0;
            cursor: pointer;
            font-weight: 700;
        }

        .pending-card .approve {
            background: #00b894;
            color: #fff;
        }

        .pending-card .reject {
            background: #d63031;
            color: #fff;
            margin-inline-start: 8px;
        }

        .admin-empty {
            color: #8a8fa3;
            background: #14172a;
            border: 1px dashed #2a2f45;
            border-radius: 14px;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>

<body>
    <header class="slim-nav">
        <a href="index.html" class="slim-nav__back">بازگشت</a>
        <nav class="site-nav">
            <a href="index.html">خانه</a>
            <a href="news.html">اخبار</a>
            <a href="chat.html">چت</a>
            <a href="chat.html">چت</a>
            <a href="profile.html">پروفایل</a>
            <a href="admin.html" class="active">ادمین</a>
        </nav>
    </header>
    <main class="admin-page">
        <h1>پنل مدیریت TOREX</h1>
        <p class="hint">درخواست‌های عضویت در VEXORA CHAT را بررسی و تایید کنید.</p>
        <div class="admin-login">
            <input type="password" id="adminKeyInput" placeholder="کلید ادمین را وارد کنید" autocomplete="off">
            <button id="adminLoadButton" type="button">بارگذاری درخواست‌ها</button>
        </div>
        <div id="pendingList"></div>
    </main>
    <script src="./app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const input = document.getElementById("adminKeyInput");
            const button = document.getElementById("adminLoadButton");
            const list = document.getElementById("pendingList");
            const savedKey = sessionStorage.getItem("torexAdminKey") || "";
            if (savedKey) input.value = savedKey;
            async function load() {
                const adminKey = input.value.trim();
                if (!adminKey) { showToast("کلید ادمین را وارد کنید."); return; }
                sessionStorage.setItem("torexAdminKey", adminKey);
                list.replaceChildren();
                try {
                    const result = await torexRequest("/admin/pending?adminKey=" + encodeURIComponent(adminKey));
                    if (!result.pending.length) {
                        const empty = document.createElement("div");
                        empty.className = "admin-empty";
                        empty.textContent = "درخواستی وجود ندارد. همه اعضا تایید شده‌اند. ✅";
                        list.append(empty);
                        return;
                    }
                    result.pending.forEach(user => {
                        const card = document.createElement("div");
                        card.className = "pending-card";
                        const avatar = document.createElement("div");
                        avatar.className = "p-avatar";
                        avatar.textContent = (user.avatar || user.username[0]).toUpperCase();
                        const info = document.createElement("div");
                        info.className = "p-info";
                        const name = document.createElement("strong");
                        name.textContent = user.name + " (@" + user.username + ")";
                        const meta = document.createElement("small");
                        meta.textContent = "درخواست عضویت گیمر";
                        info.append(name, meta);
                        const approve = document.createElement("button");
                        approve.type = "button"; approve.className = "approve"; approve.textContent = "تایید ✅";
                        const reject = document.createElement("button");
                        reject.type = "button"; reject.className = "reject"; reject.textContent = "رد ❌";
                        approve.addEventListener("click", () => decide(user.username, false));
                        reject.addEventListener("click", () => decide(user.username, true));
                        card.append(avatar, info, approve, reject);
                        list.append(card);
                    });
                } catch (error) { showToast(error.message); }
            }
            async function decide(username, reject) {
                try {
                    await torexRequest("/admin/approve", { method: "POST", body: JSON.stringify({ adminKey: sessionStorage.getItem("torexAdminKey"), username, reject }) });
                    showToast(reject ? "درخواست رد شد." : "کاربر تایید و به جامعه گیمرها اضافه شد.");
                    load();
                } catch (error) { showToast(error.message); }
            }
            button.addEventListener("click", load);
            input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); load(); } });
            if (savedKey) load();
        });
    </script>
</body>

</html>
