version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vexora-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://vexora_admin:${DB_PASSWORD}@postgres:5432/vexora_chat
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - vexora-network

  postgres:
    image: postgres:15-alpine
    container_name: vexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vexora_chat
      POSTGRES_USER: vexora_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vexora_admin -d vexora_chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vexora-network

  redis:
    image: redis:7-alpine
    container_name: vexora-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vexora-network

  nginx:
    image: nginx:alpine
    container_name: vexora-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./public:/usr/share/nginx/html/static:ro
    depends_on:
      - app
    networks:
      - vexora-network

networks:
  vexora-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
